[project]
name = "wallpaper-manager"
version = "0.1.0"
description = "A desktop wallpaper manager built with PySide6"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Timo Schiller", email = "timo.schiller@googlemail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.1",
]

[project.scripts]
wallpaper-manager = "wallpaper_manager:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
