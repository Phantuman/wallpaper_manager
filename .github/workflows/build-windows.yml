name: Build Windows executable

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked pytest

      - name: Build executable
        run: >-
          uv run --locked --with pyinstaller==6.22.3 python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name WallpaperManager
          --specpath build
          --collect-data wallpaper_manager
          src/wallpaper_manager/__main__.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WallpaperManager-windows-x64
          path: |
            dist/WallpaperManager.exe
            LICENSE
          if-no-files-found: error
          retention-days: 30
