name: Build Windows executable

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked pytest

      - name: Build executable
        run: >-
          uv run --locked --with pyinstaller==6.22.3 python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name WallpaperManager
          --specpath build
          --collect-data wallpaper_manager
          src/wallpaper_manager/__main__.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: WallpaperManager-windows-x64
          path: |
            dist/WallpaperManager.exe
            LICENSE
          if-no-files-found: error
          retention-days: 30
